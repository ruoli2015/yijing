- num: 17
  name: 隨
  pinyin: suí
  en: Following
  gist_zh: 我動而彼悅，相隨而行；隨從須擇善。
  gist_en: Moving so that others gladly follow — but follow only what is good.
  link: 承
  xugua_en: Where there is delight there will be followers; therefore Sui follows.
  logic_zh: >-
    一個人能讓人喜悅，別人就會跟隨他。隨卦兌（悅）在上、震（動）在下：我動而彼悅，所以相隨。
    隨也有「隨時」之意——順應時勢變化。但跟隨要擇善而從，卦辭說「元亨利貞，无咎」，跟隨必須以正道為前提。
  logic_en: >-
    Someone who brings joy draws followers. Sui 隨 is Lake (joy) above Thunder (movement): I move and
    others are glad, so they follow. Sui also means going along with the times. But one must follow what is
    good; the judgment's "great success, beneficial to be correct, no blame" makes rightness the condition
    of following.

- num: 18
  name: 蠱
  pinyin: gǔ
  en: Repairing Decay
  en_alt: Work on What Has Been Spoiled
  gist_zh: 積弊已生，必須著手整治。
  gist_en: Corruption has set in — time to fix what has been spoiled.
  link: 承
  xugua_en: >-
    Those who follow others out of delight are sure to have affairs to deal with; therefore Gu follows.
    Gu means affairs.
  logic_zh: >-
    只因喜悅而盲目跟隨，久而久之必生弊端。「蠱」字是器皿中生蟲，意為腐敗積弊；序卦傳解作「事」，
    即需要處理的事務。隨與蠱互為綜卦，也互為錯卦：風平浪靜的隨從之後，問題暴露，必須著手整治。
    卦辭「先甲三日，後甲三日」，強調整頓要審慎謀劃、承前啟後。
  logic_en: >-
    Following others merely because it feels good breeds problems over time. The character 蠱 shows worms
    in a vessel — rot, accumulated corruption; the Xugua glosses it as "affairs," things that must be dealt
    with. Sui 隨 and Gu 蠱 are both inverted and opposite versions of each other: after easygoing following,
    the problems surface and must be repaired. "Three days before the starting day, three days after":
    reform needs careful planning, looking both back and forward.

- num: 19
  name: 臨
  pinyin: lín
  en: Approach
  en_alt: Overseeing
  gist_zh: 陽氣漸長，居上臨下，事業壯大。
  gist_en: Yang is on the rise — overseeing, growing great.
  link: 承
  xugua_en: Having affairs to manage, one can then become great; therefore Lin follows. Lin means great.
  logic_zh: >-
    能夠勇於任事、整治弊端，事業才能壯大。「臨」是居高臨下、親臨治理，序卦傳解為「大」。
    卦象兩個陽爻自下而上增長，陽氣漸盛，象徵力量日益壯大。但卦辭也提醒「至于八月有凶」——盛長之時要預見衰退。
  logic_en: >-
    Only by taking on affairs and fixing what is broken can an enterprise grow great. Lin 臨 means
    approaching from above, overseeing; the Xugua glosses it as "great." Two yang lines grow from the
    bottom: strength is on the rise. Yet the judgment warns, "in the eighth month there will be
    misfortune" — in times of growth, foresee decline.

- num: 20
  name: 觀
  pinyin: guān
  en: Contemplation
  en_alt: Viewing
  gist_zh: 風行地上——在上者為人所瞻仰，也觀照天下。
  gist_en: Wind over the earth — being looked up to, and looking out over all.
  link: 承
  xugua_en: When things are great, they can be contemplated; therefore Guan follows.
  logic_zh: >-
    事物壯大之後，才有可觀之處，值得人們瞻仰；同時居上位者也要觀察天下。觀卦巽（風）行地上，
    風吹遍大地，無所不至，象徵觀察與教化。臨與觀互為綜卦：臨是居上而臨下，觀是在上者被下觀仰，也觀照下民——
    治理從力量轉向示範與省察。
  logic_en: >-
    Once something has grown great it becomes worth beholding, and those above must also observe the
    world. Guan 觀 is Wind moving over the Earth, reaching everywhere: observation and moral influence.
    Lin 臨 and Guan 觀 are an inverted pair: in Lin the superior approaches those below; in Guan the
    superior is looked up to and in turn surveys the people. Rule shifts from power to example and
    reflection.

- num: 21
  name: 噬嗑
  pinyin: shì kè
  en: Biting Through
  gist_zh: 口中有物梗阻，咬斷才能合攏——明罰敕法。
  gist_en: Something blocks the jaws — bite through it so they can close; law and justice.
  link: 承
  xugua_en: >-
    Being worth contemplating, there will then be things that come together; therefore Shi He follows.
    He means closing together.
  logic_zh: >-
    有可觀之德，人們便想來合。但要真正相合，中間的阻隔必須咬斷。噬嗑卦像張開的嘴（初、上兩陽為唇，中間陰爻為空），
    九四一陽橫梗其中，必須「噬」（咬）掉才能「嗑」（合攏）。所以此卦講刑罰訟獄：清除障礙，才能實現團結。
  logic_en: >-
    Something worth beholding attracts people who want to come together, but for real union the obstacle
    in between must be bitten through. The hexagram looks like an open mouth, with yang lines at top and
    bottom as lips and a yang line in the fourth place stuck between them. It must be bitten (噬) for the
    jaws to close (嗑). Hence the theme of law and punishment: remove the obstruction to achieve union.

- num: 22
  name: 賁
  pinyin: bì
  en: Grace
  en_alt: Adornment
  gist_zh: 山下有火，草木生輝——以文飾使結合有禮有度。
  gist_en: Fire beneath the mountain lights it up — form and beauty give union its order.
  link: 補
  xugua_en: >-
    Things cannot simply come together carelessly; therefore Bi follows. Bi means adornment.
  logic_zh: >-
    人與人、物與物的結合不能草率隨便，需要禮文加以修飾，使之有秩序、有美感。賁卦艮（山）下有離（火），
    火照山上草木，光彩斑斕。噬嗑與賁互為綜卦：前者以刑罰強制相合，後者以文飾使結合有禮有度——由「刑」轉向「文」。
  logic_en: >-
    Unions between people or things should not be slapdash; they need cultural form — ritual and grace —
    to give them order and beauty. Bi 賁 is Fire below the Mountain, lighting the plants on its slopes in
    brilliant color. Shi He 噬嗑 and Bi 賁 are an inverted pair: one enforces union through punishment, the
    other refines it through culture — from law to grace.

- num: 23
  name: 剝
  pinyin: bō
  en: Stripping Away
  en_alt: Splitting Apart
  gist_zh: 群陰剝陽，只剩一陽在上——宜靜守，不宜妄動。
  gist_en: Yin erodes yang until one line remains — hold still, do not act rashly.
  link: 承
  xugua_en: >-
    When adornment is carried to its utmost, success is used up; therefore Bo follows. Bo means stripping
    away.
  logic_zh: >-
    文飾若推到極端，徒有其表，內在的真實便耗盡了。過度修飾的結果是剝落、衰敗。剝卦五陰在下、一陽在上，
    陰氣自下而上一路侵蝕，只剩最後一個陽爻，如牆皮剝落、房屋將傾。卦辭「不利有攸往」——此時宜靜守，不宜妄動。
  logic_en: >-
    Push ornament to the extreme and only surface remains; the inner substance is used up. Excessive
    decoration ends in peeling and decay. Bo 剝 has five yin lines eating upward until only one yang line is
    left at the top, like plaster flaking off a house about to fall. "It is not beneficial to go anywhere":
    this is a time to hold still.

- num: 24
  name: 復
  pinyin: fù
  en: Return
  gist_zh: 一陽來復，黑暗最深處孕育光明。
  gist_en: One yang line returns — light reborn in the deepest dark.
  link: 反
  xugua_en: >-
    Things cannot be used up forever; when stripping reaches the top it returns to the bottom; therefore
    Fu follows.
  logic_zh: >-
    這是卦序中最著名的轉折之一。剝到盡頭，最後一個陽爻從上方消失，卻在最下方重新出現——一陽來復。
    剝與復互為綜卦，把剝倒轉過來就是復。冬至一陽生，黑暗最深處孕育光明。彖傳說「復，其見天地之心乎」：
    生生不息，正是天地的本心。
  logic_en: >-
    One of the most famous turns in the sequence. When stripping is complete, the last yang line vanishes
    at the top only to reappear at the bottom: "one yang returns." Bo 剝 and Fu 復 are an inverted pair —
    turn Bo upside down and you get Fu. At the winter solstice light is reborn in the deepest dark. The Tuan
    says, "In Fu we see the heart of heaven and earth": ceaseless renewal is the cosmos's own intent.

- num: 25
  name: 无妄
  pinyin: wú wàng
  en: Innocence
  en_alt: Without Falseness
  gist_zh: 真實無偽，動合天理，不作非分之想。
  gist_en: Genuine and unfeigned — acting in accord with heaven, wanting nothing improper.
  link: 承
  xugua_en: With return, there is no more falseness; therefore Wu Wang follows.
  logic_zh: >-
    回歸本源、恢復正道之後，行為就不再虛妄。「无妄」即真實無偽、不存非分之想。卦象乾（天）在上、震（動）在下——
    動而合乎天理。程頤解為「至誠」。无妄也有「意外」之意：一切順其自然，不刻意妄求，即便遇到「无妄之災」也不必驚慌。
  logic_en: >-
    Having returned to the source and the right way, one's actions are no longer false. Wu Wang 无妄 means
    genuine, without pretense or improper desire. Heaven above Thunder: movement in accord with heaven's
    pattern. Cheng Yi reads it as utmost sincerity. It also suggests the unexpected: act naturally, scheme
    for nothing, and even an "unforeseen calamity" need not throw you.

- num: 26
  name: 大畜
  pinyin: dà chù
  en: Great Accumulation
  en_alt: Great Restraint
  gist_zh: 天在山中——蓄德深厚，多識前言往行。
  gist_en: Heaven held within the mountain — a deep store of virtue and learning.
  link: 承
  xugua_en: Having no falseness, one can then accumulate; therefore Da Xu follows.
  logic_zh: >-
    真誠無妄，才能積蓄真正的德行和實力。大畜卦艮（山）在上、乾（天）在下：天被包容在山中，比喻蓄積之大。
    與小畜相比，小畜是一陰畜五陽，力量有限；大畜則是艮山以剛止健，畜得穩固而深厚。无妄與大畜互為綜卦。
    象傳說：「君子以多識前言往行，以畜其德。」
  logic_en: >-
    Only genuine sincerity lets real virtue and strength be stored up. Da Xu 大畜 is Mountain above Heaven:
    heaven itself held within the mountain, an image of vast accumulation. In Xiao Xu 小畜 (9) a single yin
    line restrains five yang; here the firm mountain contains the strong, making a solid, deep store.
    Wu Wang 无妄 and Da Xu 大畜 are an inverted pair. "The superior person learns many sayings and deeds of
    the past to build up virtue."

- num: 27
  name: 頤
  pinyin: yí
  en: Nourishment
  en_alt: The Jaws
  gist_zh: 張口之象——觀其所養，便知其人。
  gist_en: An open mouth — how one nourishes self and others reveals character.
  link: 承
  xugua_en: >-
    When things have been accumulated, they can be nourished; therefore Yi follows. Yi means nourishing.
  logic_zh: >-
    有了積蓄，才能養育——養身，也養德。「頤」本指臉頰、下巴，卦形正像張開的口：上下兩陽爻是上下顎，
    中間四陰爻是口腔。卦辭「觀頤，自求口實」，提醒人看一個人如何養己養人，便知其品格。頤與大過是一對錯卦（六爻全反）。
  logic_en: >-
    Once there are stores, there can be nourishment — of body and of virtue. Yi 頤 originally means the
    jaws, and the hexagram looks like an open mouth: yang lines top and bottom as the jaws, four yin lines
    as the hollow between. "Observe the jaws, and what one seeks to fill one's mouth with": how people
    nourish themselves and others reveals their character. Yi 頤 and Da Guo 大過 are a complementary pair
    (every line inverted).

- num: 28
  name: 大過
  pinyin: dà guò
  en: Great Excess
  en_alt: Preponderance of the Great
  gist_zh: 棟樑中重而兩端弱——非常之時，行非常之事。
  gist_en: A sagging ridgepole — extraordinary times call for extraordinary action.
  link: 承
  xugua_en: Without nourishment one cannot act; therefore Da Guo follows.
  logic_zh: >-
    有養才能有所作為，養得充足就能做出非常之事。「大過」是大的過度——陽剛過盛：四個陽爻擠在中間，
    兩端陰爻柔弱，如同「棟橈」，屋樑中間粗重而兩端不勝負荷。這是非常時期，需要非常之舉；
    象傳說「君子以獨立不懼，遯世无悶」。
  logic_en: >-
    Only the nourished can act, and with ample nourishment one can do extraordinary things. Da Guo 大過 is
    great excess, too much yang: four strong lines crowd the middle while the weak ends cannot bear them,
    like "a ridgepole that sags." It is an extraordinary time calling for extraordinary action: "the
    superior person stands alone without fear, and withdraws from the world without regret."

- num: 29
  name: 坎
  pinyin: kǎn
  en: The Abysmal
  en_alt: Water, Danger
  gist_zh: 重重險陷；行險而不失其信。
  gist_en: Danger upon danger — move through it without losing faith.
  link: 反
  xugua_en: Things cannot be in excess forever; therefore Kan follows. Kan means a pit.
  logic_zh: >-
    過度之後必然陷入險境。坎為水、為陷，上下皆坎，重重險難，所以又名「習坎」。但坎卦也教人如何處險：
    水流不止、不失其信——一陽居中，內心剛實，就能「維心亨」。在危難中保持誠信與恆心，才能出險。
  logic_en: >-
    Excess inevitably leads into danger. Kan 坎 is water, a pit; doubled, it is danger upon danger, hence
    the name "repeated Kan." Yet it also teaches how to live with danger: water keeps flowing without
    losing its way, and a yang line stays firm at the center, so "holding to the heart brings success."
    Keep faith and persistence amid peril, and you will come through.

- num: 30
  name: 離
  pinyin: lí
  en: The Clinging
  en_alt: Fire, Radiance
  gist_zh: 火附薪而明，日月麗天——有所依附而生光明。
  gist_en: Fire clings to fuel, sun and moon to the sky — attachment that gives light.
  link: 補
  xugua_en: Falling into a pit, one must cling to something; therefore Li follows. Li means clinging.
  logic_zh: >-
    陷入險境，必須有所依附才能脫困。「離」解作「麗」，即附著——如火附著於薪柴而燃燒、日月附著於天而光明。
    坎與離是錯卦：坎外柔內剛，陷而中實；離外剛內柔，明而中虛。上經以坎離作結：水火是天地之間最大的作用力，
    也象徵月與日，與開頭的乾坤（天地）首尾呼應。
  logic_en: >-
    Having fallen into danger, one must cling to something to get out. The Xugua glosses Li 離 as 麗,
    "attaching" — as fire clings to fuel to burn, and sun and moon cling to the sky to shine. Kan 坎 and
    Li 離 are complementary opposites: Kan is soft outside and firm within; Li is firm outside and empty
    within. The Upper Canon ends with water and fire, the great active forces between heaven and earth,
    also the moon and sun — answering Qian and Kun (heaven and earth) at its opening.

- num: 31
  name: 咸
  pinyin: xián
  en: Influence
  en_alt: Mutual Attraction
  gist_zh: 少男少女，無心之感；下經從人倫開始。
  gist_en: Young man and young woman, spontaneous attraction — the Lower Canon begins with human bonds.
  link: 始
  xugua_en: >-
    There are heaven and earth, and then the myriad things; there are the myriad things, and then male and
    female; male and female, then husband and wife; husband and wife, then father and son; father and son,
    then ruler and minister; ruler and minister, then high and low; and when there are high and low,
    ritual and righteousness have their place.
  logic_zh: >-
    下經重新從「天地」說起，但很快轉向人倫：男女→夫婦→父子→君臣→上下→禮義，整個社會秩序都根源於夫婦。
    咸卦兌（少女）在上、艮（少男）在下；彖傳說「咸，感也」，傳統解釋「咸」是「感」去掉「心」，代表無心之感、
    自然的相互感應。上經以天地開篇，下經以男女感應開篇：先講天道，再講人道。和乾坤一樣，序卦傳在這段話中
    沒有寫出「咸」字，而是讓整段話引出它。
  logic_en: >-
    The Lower Canon starts again from heaven and earth but turns at once to human relationships: male and
    female → husband and wife → parent and child → ruler and minister → high and low → ritual. All social
    order grows from the bond of husband and wife. Xian 咸 puts Lake (the youngest daughter) above Mountain
    (the youngest son). The Tuan says "Xian means feeling," and tradition notes that 咸 is 感 (feeling)
    without the heart 心 — spontaneous, unwilled response. The Upper Canon opens with heaven and earth, the
    Lower with the attraction of man and woman: the way of heaven, then the way of humans. As with Qian and
    Kun, the passage never names Xian; the whole sentence leads up to it.

- num: 32
  name: 恆
  pinyin: héng
  en: Duration
  en_alt: Constancy
  gist_zh: 雷風相與，持久不息；在變化中守正。
  gist_en: Thunder and wind together, lasting — holding a steady course through change.
  link: 補
  xugua_en: The way of husband and wife cannot but endure; therefore Heng follows. Heng means lasting.
  logic_zh: >-
    夫婦的感情始於相互感應，但必須長久維持。咸與恆互為綜卦：咸是少男在少女之下，追求、感應的熱戀階段；
    恆是長男（震）在上、長女（巽）在下，各安其位的婚姻生活。雷風相與，動而不息。
    恆不是靜止不變，而是在變化中持守正道。
  logic_en: >-
    Marriage begins with mutual attraction but must be sustained. Xian 咸 and Heng 恆 are an inverted pair:
    in Xian the young man defers to the young woman — courtship, the spark; in Heng the eldest son
    (Thunder) is above and the eldest daughter (Wind) below — settled married life with each in place.
    Thunder and wind work together, moving ceaselessly. Constancy is not standing still but holding a right
    course through change.
